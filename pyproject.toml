[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riskchallenger"
version = "0.1.0"
description = "Foundation for an AI-assisted quantitative risk model validation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RiskChallenger contributors" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "arch>=7.2,<9",
    "scikit-learn>=1.5,<2",
    "xgboost>=3.0,<4",
    "streamlit>=1.47,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["riskchallenger*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

